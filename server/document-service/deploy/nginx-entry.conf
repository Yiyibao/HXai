location = /documents {
    return 308 /documents/;
}
location ^~ /documents/ {
    client_max_body_size 30m;
    client_body_timeout 120s;
    limit_conn mathdoc_clients 6;
    limit_req zone=mathdoc_requests burst=20 nodelay;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    access_log off;
    # Inherits existing verified origin TLS and client certificate configuration.
    proxy_pass https://hk_backend;
    proxy_set_header Host hxnf.top;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
}
